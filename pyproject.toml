[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "varsim"
version = "2.0.1"
authors = [
  { name="Liu Sun", email="sunliu@yxnu.edu.cn" },
  { name="Jian Yang", email="yangjian@yxnu.edu.cn" },
]
description = "HGVS variant toolkit: parse, validate, normalize, backtranslate, convert, extract, liftover, transcribe, and translate HGVS descriptions."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
  "biopython",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
]

[project.urls]
Homepage = "https://github.com/liu-sun/VarSim"
Issues = "https://github.com/liu-sun/VarSim/issues"
Documentation = "https://github.com/liu-sun/VarSim#readme"